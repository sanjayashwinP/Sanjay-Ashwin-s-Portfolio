services:
  - type: web
    name: sanjay-portfolio-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        value: https://*.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: sanjay_admin
      - key: ADMIN_PASSWORD
        value: Sanjay@SecureAdmin2026!
