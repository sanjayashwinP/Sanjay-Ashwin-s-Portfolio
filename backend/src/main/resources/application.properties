spring.application.name=portfolio-backend
server.port=${SERVER_PORT:8080}

# Spring Data JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Database Configuration
# Uses MySQL if DB_URL is set, otherwise defaults to local persistent H2 database for zero-config startup
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/portfoliodb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (convenient for inspecting data locally)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Authentication
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Seed Account
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:adminPassword123!}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# File Upload / Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
